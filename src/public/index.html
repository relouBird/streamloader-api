<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamLoader API</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0c0c14;
            color: #eeeef8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }

        .card {
            background: rgba(22, 22, 46, 0.8);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            border: 1px solid rgba(123, 95, 245, 0.3);
            color: #b0a0ff;
            background: rgba(123, 95, 245, 0.1);
        }

        p {
            font-size: 14px;
            color: #9090b8;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        p.special {
            font-size: 13px;
            margin-bottom: 24px;
        }

        code {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 13px;
            color: #b0a0ff;
        }

        .links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ddd;
            background: rgba(255, 255, 255, 0.06);
        }

        .btn:hover {
            background: rgba(123, 95, 245, 0.15);
            border-color: rgba(123, 95, 245, 0.4);
            color: #fff;
        }

        .btn.primary {
            background: #7b5ff5;
            border-color: #7b5ff5;
            color: #fff;
        }

        .btn.primary:hover {
            background: #6a4ee0;
        }

        .status {
            font-size: 12px;
            color: #5858a0;
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <div class="card">
        <!-- Logo StreamLoader -->
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M13 2L4.5 13.5H11L10.5 22L19.5 10.5H13L13 2Z" fill="url(#g)" />
                <defs>
                    <linearGradient id="g" x1="4.5" y1="2" x2="19.5" y2="22" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#C4A5FF" />
                        <stop offset="1" stop-color="#7B5FF5" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <h1>StreamLoader API</h1>
        <div class="badge">Backend Service</div>
        <p>
            Cette URL fait partie de l'API de StreamLoader.<br>
            Les pages web sont servies par le <strong>frontend</strong> (côté utilisateur).
        </p>
        <p class="special">
            <code>/api/v1/...</code> endpoints disponibles.<br>
            Pour la documentation complète, consulte la doc développeur.
        </p>
        <div class="links">
            <a href="#" class="btn primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                </svg>
                Frontend
            </a>
            <a href="/api/health" class="btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                </svg>
                Health
            </a>
        </div>
        <div class="status">
            ● Tous les systèmes opérationnels
        </div>
    </div>
</body>

</html>
